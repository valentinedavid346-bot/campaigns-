<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Memoriam</title>
<style>
  :root {
    --ink: #0b0b0d;
    --bone: #e8e3d8;
    --candle: #c9a24b;
    --candle-dim: #7a6329;
    --ash: #3a3a3f;
    --grief: #1a1c22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--ink);
    color: var(--bone);
    font-family: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', serif;
    overflow: hidden;
  }
  .page {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }
  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- PAGE ONE ---------- */
  #page-one {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(120,100,50,0.10), transparent 60%),
      var(--ink);
  }
  .candles {
    display: flex;
    gap: 3.2rem;
    margin-bottom: 2.8rem;
  }
  .candle {
    width: 6px;
    height: 46px;
    background: linear-gradient(#f2e6c8, #b89b52);
    border-radius: 2px;
    position: relative;
    animation: sway 4.5s ease-in-out infinite;
  }
  .candle:nth-child(2) { animation-delay: -1.5s; height: 60px; }
  .candle:nth-child(3) { animation-delay: -3s; }
  .flame {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 18px;
    background: radial-gradient(circle at 50% 70%, #fff3c4, var(--candle) 60%, transparent 75%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    filter: blur(0.3px);
    animation: flicker 1.8s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    0% { transform: translateX(-50%) scaleY(1) rotate(-1deg); opacity: 0.9; }
    50% { transform: translateX(-50%) scaleY(1.08) rotate(1.5deg); opacity: 1; }
    100% { transform: translateX(-50%) scaleY(0.95) rotate(-2deg); opacity: 0.85; }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(0.6deg); }
  }
  .eyebrow {
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 0.68rem;
    color: var(--candle-dim);
    margin-bottom: 1.1rem;
  }
  h1.epitaph {
    font-family: 'Iowan Old Style', 'Georgia', serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.6rem);
    line-height: 1.25;
    max-width: 16ch;
    color: var(--bone);
  }
  h1.epitaph .goat {
    display: block;
    font-style: italic;
    color: var(--candle);
    margin-top: 0.3rem;
    letter-spacing: 0.02em;
  }
  .dates {
    margin-top: 1.4rem;
    font-size: 0.95rem;
    letter-spacing: 0.12em;
    color: #9a9488;
  }
  .enter-btn {
    margin-top: 3.2rem;
    background: transparent;
    border: 1px solid var(--candle-dim);
    color: var(--bone);
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 0.95rem 2.2rem;
    cursor: pointer;
    transition: border-color 0.4s ease, background 0.4s ease, letter-spacing 0.4s ease;
  }
  .enter-btn:hover {
    border-color: var(--candle);
    background: rgba(201,162,75,0.08);
    letter-spacing: 0.34em;
  }
  .enter-btn:focus-visible {
    outline: 2px solid var(--candle);
    outline-offset: 4px;
  }

  /* ---------- PAGE TWO ---------- */
  #page-two {
    background: radial-gradient(ellipse at 50% 20%, #1c2230 0%, var(--ink) 65%);
    gap: 1.6rem;
  }
  .frame {
    width: min(78vw, 420px);
    border: 1px solid var(--candle-dim);
    padding: 10px;
    background: #050506;
    box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,162,75,0.05);
  }
  .frame img {
    display: block;
    width: 100%;
    height: auto;
    filter: sepia(8%) saturate(90%) brightness(0.96);
  }
  .caption {
    font-style: italic;
    color: #9a9488;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    max-width: 32ch;
  }
  .sound-toggle {
    margin-top: 1.4rem;
    background: none;
    border: none;
    color: var(--candle-dim);
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .sound-toggle:hover { color: var(--candle); }

  @media (prefers-reduced-motion: reduce) {
    .candle, .flame { animation: none; }
  }
</style>
</head>
<body>

  <section id="page-one" class="page active">
    <div class="candles">
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
      <div class="candle"><div class="flame"></div></div>
    </div>
    <p class="eyebrow">A Solemn Gathering</p>
    <h1 class="epitaph">Today we mourn the memory of<span class="goat">the G.O.A.T.</span></h1>
    <p class="dates">1783 &mdash; 2026</p>
    <button class="enter-btn" id="enter-btn">Enter Funeral</button>
  </section>

  <section id="page-two" class="page">
    <div class="frame">
      <!-- Replace the src below with your own image path or a re-embedded base64 string -->
      <img src="turtle-rip.png" alt="Rest in peace, 1783 to 2026, a turtle resting on clouds beneath a stairway to heaven">
    </div>
    <p class="caption">Gone but not forgotten. May the ponds of the beyond be forever warm.</p>
    <button class="sound-toggle" id="sound-toggle">Mute music</button>
  </section>

<script>
  const pageOne = document.getElementById('page-one');
  const pageTwo = document.getElementById('page-two');
  const enterBtn = document.getElementById('enter-btn');
  const soundToggle = document.getElementById('sound-toggle');

  let audioCtx = null;
  let playing = false;
  let dirgeTimer = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playChord(freqs, startTime, duration, gainPeak) {
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0.0001, startTime);
    master.gain.exponentialRampToValueAtTime(gainPeak, startTime + duration * 0.25);
    master.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    master.connect(audioCtx.destination);

    freqs.forEach((f) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const detuneOsc = audioCtx.createOscillator();
      detuneOsc.type = 'sine';
      detuneOsc.frequency.value = f * 1.003;

      const g = audioCtx.createGain();
      g.gain.value = 0.5;
      osc.connect(g);
      detuneOsc.connect(g);
      g.connect(master);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.1);
      detuneOsc.start(startTime);
      detuneOsc.stop(startTime + duration + 0.1);
    });
  }

  const progression = [
    [98.00, 116.54, 146.83],
    [87.31, 116.54, 130.81],
    [82.41, 98.00, 123.47],
    [98.00, 116.54, 146.83],
  ];
  const chordLength = 3.6;

  function scheduleDirge() {
    if (!playing) return;
    const now = audioCtx.currentTime + 0.1;
    progression.forEach((chord, i) => {
      playChord(chord, now + i * chordLength, chordLength, 0.09);
    });
    dirgeTimer = setTimeout(scheduleDirge, progression.length * chordLength * 1000);
  }

  function startDirge() {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (playing) return;
    playing = true;
    scheduleDirge();
  }

  function stopDirge() {
    playing = false;
    if (dirgeTimer) clearTimeout(dirgeTimer);
  }

  enterBtn.addEventListener('click', () => {
    pageOne.classList.remove('active');
    pageTwo.classList.add('active');
    startDirge();
  });

  soundToggle.addEventListener('click', () => {
    if (playing) {
      stopDirge();
      soundToggle.textContent = 'Play music';
    } else {
      startDirge();
      soundToggle.textContent = 'Mute music';
    }
  });
</script>
</body>
</html>
